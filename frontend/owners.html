<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VetCare - Owners</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-10 font-sans">
    <nav class="max-w-6xl mx-auto mb-6 space-x-4 bg-white p-4 rounded shadow">
        <a href="index.html" class="text-blue-600 hover:text-blue-800">Appointments</a>
        <a href="owners.html" class="font-bold text-gray-800 border-b-2 border-blue-600">Owners</a>
        <a href="pets.html" class="text-blue-600 hover:text-blue-800">Pets</a>
    </nav>

    <div class="max-w-6xl mx-auto grid grid-cols-3 gap-8">
        <div class="col-span-1 bg-white shadow-md rounded-lg p-6 h-fit">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Add Owner</h2>
            <form id="owner-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Name</label>
                    <input type="text" id="name" class="mt-1 block w-full border border-gray-300 rounded-md p-2" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Contact Number</label>
                    <input type="text" id="contact" class="mt-1 block w-full border border-gray-300 rounded-md p-2" required placeholder="09...">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700">Save Owner</button>
            </form>
        </div>

        <div class="col-span-2 bg-white shadow-md rounded-lg overflow-hidden h-fit">
            <table class="min-w-full text-left">
                <thead class="bg-gray-200">
                    <tr>
                        <th class="p-4 font-semibold text-gray-700">ID</th>
                        <th class="p-4 font-semibold text-gray-700">Name</th>
                        <th class="p-4 font-semibold text-gray-700">Contact Number</th>
                        <th class="p-4 font-semibold text-gray-700">Actions</th>
                    </tr>
                </thead>
                <tbody id="table-body" class="divide-y divide-gray-200"></tbody>
            </table>
        </div>
    </div>

   <script>
        const API_URL = 'http://127.0.0.1:8000/api/owners/';

        async function fetchData() {
            const response = await fetch(API_URL);
            const data = await response.json();
            const tableBody = document.getElementById('table-body');
            tableBody.innerHTML = '';

            data.forEach(owner => {
                tableBody.innerHTML += `
                    <tr class="hover:bg-gray-50">
                        <td class="p-4 text-gray-800">${owner.id}</td>
                        <td class="p-4 text-gray-800 font-medium">${owner.name}</td>
                        <td class="p-4 text-gray-600">${owner.contact_number}</td>
                        <td class="p-4">
                            <button onclick="deleteData(${owner.id})" class="text-sm bg-red-500 text-white px-2 py-1 rounded hover:bg-red-600">Delete</button>
                        </td>
                    </tr>
                `;
            });
        }

        document.getElementById('owner-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: document.getElementById('name').value,
                        contact_number: document.getElementById('contact').value
                    })
                });

                if (response.ok) {
                    document.getElementById('owner-form').reset();
                    fetchData();
                } else {
                    const errorData = await response.json();
                    alert("Error from Django: " + JSON.stringify(errorData));
                }
            } catch (error) {
                alert("Network Error or Server Offline: " + error);
            }
        });

        async function deleteData(id) {
            await fetch(`${API_URL}${id}/`, { method: 'DELETE' });
            fetchData();
        }

        window.onload = fetchData;
    </script>
</body>
</html>
