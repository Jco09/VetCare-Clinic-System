<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VetCare - Pets</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-10 font-sans">
    <nav class="max-w-6xl mx-auto mb-6 space-x-4 bg-white p-4 rounded shadow">
        <a href="index.html" class="text-blue-600 hover:text-blue-800">Appointments</a>
        <a href="owners.html" class="text-blue-600 hover:text-blue-800">Owners</a>
        <a href="pets.html" class="font-bold text-gray-800 border-b-2 border-blue-600">Pets</a>
    </nav>

    <div class="max-w-6xl mx-auto grid grid-cols-3 gap-8">
        <div class="col-span-1 bg-white shadow-md rounded-lg p-6 h-fit">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Add Pet</h2>
            <form id="pet-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Pet Name</label>
                    <input type="text" id="name" class="mt-1 block w-full border border-gray-300 rounded-md p-2" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Species</label>
                    <input type="text" id="species" class="mt-1 block w-full border border-gray-300 rounded-md p-2" required placeholder="Dog, Cat, etc.">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Owner</label>
                    <select id="owner_id" class="mt-1 block w-full border border-gray-300 rounded-md p-2" required>
                        <option value="" disabled selected>Select an owner</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700">Save Pet</button>
            </form>
        </div>

        <div class="col-span-2 bg-white shadow-md rounded-lg overflow-hidden h-fit">
            <table class="min-w-full text-left">
                <thead class="bg-gray-200">
                    <tr>
                        <th class="p-4 font-semibold text-gray-700">ID</th>
                        <th class="p-4 font-semibold text-gray-700">Pet Name</th>
                        <th class="p-4 font-semibold text-gray-700">Species</th>
                        <th class="p-4 font-semibold text-gray-700">Owner ID</th>
                        <th class="p-4 font-semibold text-gray-700">Actions</th>
                    </tr>
                </thead>
                <tbody id="table-body" class="divide-y divide-gray-200"></tbody>
            </table>
        </div>
    </div>

    <script>
    const API_URL = 'http://127.0.0.1:8000/api/pets/';
    const OWNERS_URL = 'http://127.0.0.1:8000/api/owners/';

    async function loadInitialData() {
        try {
            // 1. LOAD OWNERS INTO DROPDOWN
            const ownerRes = await fetch(OWNERS_URL);
            const owners = await ownerRes.json();
            const select = document.getElementById('owner_id');

            // Clear and add placeholder
            select.innerHTML = '<option value="" disabled selected>Select an owner</option>';

            owners.forEach(owner => {
                const opt = document.createElement('option');
                opt.value = owner.id;
                opt.innerHTML = owner.name + " (ID: " + owner.id + ")";
                select.appendChild(opt);
            });

            // 2. LOAD PETS INTO TABLE
            const petRes = await fetch(API_URL);
            const pets = await petRes.json();
            const tableBody = document.getElementById('table-body');
            tableBody.innerHTML = '';

            pets.forEach(pet => {
                tableBody.innerHTML += `
                    <tr>
                        <td class="p-4">${pet.id}</td>
                        <td class="p-4 font-bold">${pet.name}</td>
                        <td class="p-4">${pet.species}</td>
                        <td class="p-4">Owner ID: ${pet.owner}</td>
                        <td class="p-4">
                            <button onclick="deletePet(${pet.id})" class="bg-red-500 text-white px-2 py-1 rounded">Delete</button>
                        </td>
                    </tr>
                `;
            });
        } catch (err) {
            console.error("Setup failed:", err);
        }
    }

    // FORM SUBMISSION
    document.getElementById('pet-form').onsubmit = async (e) => {
        e.preventDefault();
        const data = {
            name: document.getElementById('name').value,
            species: document.getElementById('species').value,
            owner: document.getElementById('owner_id').value
        };

        await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        document.getElementById('pet-form').reset();
        loadInitialData();
    };

    async function deletePet(id) {
        await fetch(API_URL + id + "/", { method: 'DELETE' });
        loadInitialData();
    }

    // Run everything once page opens
    window.onload = loadInitialData;
</script>
